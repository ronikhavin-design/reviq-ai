data:
  n_customers: 1000
  n_months: 24
  random_seed: 42
  churn_rate_target: 0.15

churn_model:
  model_type: xgboost
  test_size: 0.2
  random_state: 42
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 5
    eval_metric: aucpr

arr_forecast:
  model_type: xgboost
  test_size: 0.2
  random_state: 42
  n_forecast_months: 3
  xgboost:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.05

risk_score:
  weights:
    churn_probability: 0.50
    arr_exposure: 0.30
    renewal_urgency: 0.20
  thresholds:
    high: 0.65
    medium: 0.35

mlflow:
  experiment_name: reviq-ai
  tracking_uri: ./mlruns
